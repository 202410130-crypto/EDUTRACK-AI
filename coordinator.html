<!DOCTYPE html>

<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#1a3520"/>
  <title>EduTrack AI — Coordinator</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" href="logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<body class="dash-body">

    <div class="user-info"><div class="user-name" id="sidebarUserName">Coordinator</div><div class="user-sub" id="sidebarUserSub">BSCS Coordinator</div></div>
  </div>
  <nav class="sidebar-nav" aria-label="Coordinator navigation">

    <!-- MY TEACHING — classes the coordinator personally teaches -->

    <a href="#" class="nav-link active" onclick="showView('myclasses',this)" title="My Classes">

    </a>
    <a href="#" class="nav-link" onclick="showView('riskreport_mine',this)" title="My Risk Reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>My Risk Report
    </a>

    <!-- COORDINATOR — monitoring all classes in their program -->

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="firebase.js"></script>
<script src="app.js"></script>
<script>

let currentClass     = null;
let currentUser      = null;   // logged-in coordinator
let currentMyClassId = null;   // class coordinator is currently teaching (My Teaching)
let currentMyClass   = null;
let editingEnrollId  = null;
let editingGradeDocId = null;
let editingGradeEnrollId = null;

document.addEventListener('DOMContentLoaded', () => {
  initPage('coordinator', (user) => {
    currentUser = user;
    populateSidebar(user);
    showView('myclasses');
  });
});

function showView(view, linkEl) {
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  if (linkEl) linkEl.classList.add('active');
  currentClass   = null;
  currentMyClass = null;
  if      (view==='myclasses')      renderMyClasses();
  else if (view==='riskreport_mine') renderMyRiskReport();
  else if (view==='classes')        renderClasses();
  else                               renderReports();
}

function loadingHTML() { return `<div style="display:flex;align-items:center;justify-content:center;height:40vh"><div class="spinner" style="width:30px;height:30px;border-width:3px;border-color:rgba(46,125,50,0.18);border-top-color:var(--green)"></div></div>`; }

/* =============================================
   MY TEACHING — Classes the coordinator teaches
   (Filtered by profEmail — separate from "All Classes")
   ============================================= */
async function renderMyClasses() {
  document.getElementById('topbarTitle').textContent = 'My Classes';
  document.getElementById('topbarBreadcrumb').textContent = 'My Teaching';
  document.getElementById('topbarRight').innerHTML = '';
  document.getElementById('pageContent').innerHTML = loadingHTML();

  try {
    // ONLY classes where this coordinator is the assigned professor
    const snap = await db.collection('classes')
      .where('profEmail','==', currentUser.email).get();
    const classes = snap.docs.map(d=>({id:d.id,...d.data()}));

    if (!classes.length) {
      document.getElementById('pageContent').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📚</div>
          <div class="empty-state-title">No classes assigned to you</div>
          <div class="empty-state-sub">Ask the admin to assign classes to ${currentUser.email}.</div>
        </div>`;
      return;
    }

    const cards = classes.map((c,i)=>`
      <div class="class-card" style="animation-delay:${i*0.06}s">
        <div class="class-card-header">
          <div><div class="class-card-title">${c.name}</div><div class="class-card-sub">${c.subject||''}</div></div>
        </div>
        <div class="class-card-body">
          <div class="class-meta">
            <div class="class-meta-item"><span>Classcode:</span><span>${c.code||'—'}</span></div>
            <div class="class-meta-item"><span>Schedule:</span><span>${c.schedule||'—'}</span></div>
            <div class="class-meta-item"><span>Room:</span><span>${c.room||'—'}</span></div>
          </div>
          <div class="class-card-footer">
            <div class="class-student-count">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              ${c.students||0} students
            </div>
            <button class="btn btn-primary" style="padding:6px 14px;font-size:0.78rem"
              onclick="openMyClass('${c.id}')">Manage →</button>
          </div>
        </div>
      </div>`).join('');

    document.getElementById('pageContent').innerHTML = `<div class="class-grid">${cards}</div>`;
  } catch(err) {
    document.getElementById('pageContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`;
  }
}

async function openMyClass(classId) {
  const snap = await db.collection('classes').doc(classId).get();
  currentMyClass   = {id:snap.id,...snap.data()};
  currentMyClassId = classId;
  renderMyClassStudents();
}

async function renderMyClassStudents() {
  const c = currentMyClass;
  document.getElementById('topbarTitle').textContent = c.name;
  document.getElementById('topbarBreadcrumb').textContent = c.subject||'';
  document.getElementById('topbarRight').innerHTML = `
    <button class="topbar-btn" onclick="renderMyClasses();document.querySelectorAll('.nav-link')[0].classList.add('active')" title="Back">← Back</button>
    <button class="topbar-btn primary" onclick="exportMyClassPDF()" title="Export PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export PDF
    </button>`;
  document.getElementById('pageContent').innerHTML = loadingHTML();

  try {
    const [eSnap, gSnap] = await Promise.all([
      db.collection('enrollments').where('class_id','==',c.id).get(),
      db.collection('grades').where('class_id','==',c.id).get()
    ]);
    const gMap = {};
    gSnap.docs.forEach(d=>{ gMap[d.data().enrollment_id]={id:d.id,...d.data()}; });

    const students = eSnap.docs.map(d=>{
      const e=d.data();
      const g=gMap[d.id];
      return {
        enrollment_id: d.id,
        student_name:  e.student_name||'',
        student_email: e.student_email||'',
        student_number:(e.student_email||'').split('@')[0]||'',
        midterm:  g?.midterm_grade||0,
        finals:   g?.finals_grade||0,
        avg:      g?.average_grade||0,
        has_grade:!!g,
        has_finals:g?.has_finals!==undefined?g.has_finals:(!!g?.finals_grade),
        grade_doc_id:g?.id||null
      };
    }).sort((a,b)=>a.student_name.localeCompare(b.student_name));

    if (!students.length) {
      document.getElementById('pageContent').innerHTML = `
        <div class="empty-state"><div class="empty-state-icon">👤</div>
        <div class="empty-state-title">No students enrolled yet</div>
        <div class="empty-state-sub">Ask the admin to assign students to this class.</div></div>`;
      return;
    }

    const rows = students.map(s=>`<tr>
      <td style="font-size:0.78rem;color:var(--text3);font-weight:600">${s.student_number||'—'}</td>
      <td style="font-weight:500">${s.student_name}</td>
      <td>${s.has_grade&&s.midterm?`<span>${s.midterm}%</span>`:'<span style="color:var(--text3)">—</span>'}</td>
      <td>${s.has_grade&&s.finals?`<span>${s.finals}%</span>`:'<span style="color:var(--text3);font-style:italic">Pending</span>'}</td>
      <td>${s.has_grade?`<strong style="color:${s.avg>=75?'var(--text)':'var(--critical)'}">${s.avg.toFixed(1)}%</strong>`:'<span style="color:var(--text3)">—</span>'}</td>
      <td>${s.has_grade?riskBadge(computeRisk(s.avg)):'—'}</td>
      <td>
        <button class="action-btn" title="Encode grades" onclick="openMyGrade('${s.enrollment_id}','${s.student_name.replace(/'/g,"\\'")}','${s.grade_doc_id||''}',${s.midterm||0},${s.finals||0})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </td>
    </tr>`).join('');

    document.getElementById('pageContent').innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Students (${students.length})</span>
        </div>
        <div class="scroll-hint" style="display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:0.7rem;color:var(--text3);padding:3px 14px 5px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Swipe to see more
        </div>
        <div class="table-scroll-wrap" style="overflow-x:auto;-webkit-overflow-scrolling:touch">
          <table class="data-table" style="min-width:580px" aria-label="My class students">
            <thead><tr>
              <th scope="col">Student ID</th>
              <th scope="col">Student Name</th>
              <th scope="col">Midterm (%)</th>
              <th scope="col">Finals (%)</th>
              <th scope="col">Average</th>
              <th scope="col">Risk Level</th>
              <th scope="col">Encode</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  } catch(err) {
    document.getElementById('pageContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`;
  }
}

/* ── Grade encoding for my class ── */
function openMyGrade(enrollId, studentName, gradeDocId, midterm, finals) {
  editingGradeEnrollId = enrollId;
  editingGradeDocId    = gradeDocId || null;
  document.getElementById('myGradeStudent').textContent  = studentName;
  document.getElementById('myGradeMidterm').value = midterm || '';
  document.getElementById('myGradeFinals').value  = finals  || '';
  document.getElementById('myGradePreview').style.display = 'none';
  document.getElementById('myGradeModal').classList.remove('hidden');
}

function previewMyGrade() {
  const m    = parseFloat(document.getElementById('myGradeMidterm').value);
  const fRaw = document.getElementById('myGradeFinals').value.trim();
  const f    = fRaw !== '' ? parseFloat(fRaw) : null;
  if (isNaN(m)) { document.getElementById('myGradePreview').style.display='none'; return; }
  const hasFinals = f!==null && !isNaN(f);
  const avg  = hasFinals ? (m+f)/2 : m;
  const risk = computeRisk(avg);
  const colors = {Safe:'var(--safe)','Slightly At Risk':'var(--slight)','Moderately At Risk':'var(--moderate)','Critically At Risk':'var(--critical)'};
  document.getElementById('myGradePreview').style.display='block';
  document.getElementById('myGradePreview').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg3);border-radius:9px;border:1px solid var(--border)">
      <div style="font-size:1.3rem;font-weight:800;color:${colors[risk]};font-family:'Syne',sans-serif">${avg.toFixed(1)}%</div>
      <div>${riskBadge(risk)}</div>
    </div>
    ${!hasFinals?`<div style="font-size:0.75rem;color:var(--text3);margin-top:5px">⚠ Finals not yet encoded. Risk based on Midterm only.</div>`:''}`;
}

async function saveMyGrade() {
  const midterm  = parseFloat(document.getElementById('myGradeMidterm').value);
  const fRaw     = document.getElementById('myGradeFinals').value.trim();
  const finals   = fRaw !== '' ? parseFloat(fRaw) : null;

  if (isNaN(midterm)||midterm<0||midterm>100) { showToast('Enter valid Midterm grade (0–100).','error'); return; }
  if (finals!==null&&(isNaN(finals)||finals<0||finals>100)) { showToast('Finals must be 0–100.','error'); return; }

  const hasFinals = finals !== null;
  const avg = hasFinals ? (midterm+finals)/2 : midterm;
  const enrollSnap = await db.collection('enrollments').doc(editingGradeEnrollId).get();
  const e = enrollSnap.data();

  const gradeData = {
    enrollment_id: editingGradeEnrollId,
    class_id:      currentMyClassId,
    class_name:    currentMyClass?.name||'',
    subject_name:  currentMyClass?.subject||'',
    student_name:  e.student_name||'',
    student_email: e.student_email||'',
    midterm_grade: midterm,
    finals_grade:  hasFinals ? finals : null,
    has_finals:    hasFinals,
    average_grade: avg,
    risk_level:    computeRisk(avg),
    status:        computeStatus(avg),
    encoded_by:    currentUser.uid,
    updated_at:    firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    if (editingGradeDocId) {
      await db.collection('grades').doc(editingGradeDocId).update(gradeData);
    } else {
      await db.collection('grades').add({...gradeData, created_at: firebase.firestore.FieldValue.serverTimestamp()});
    }
    document.getElementById('myGradeModal').classList.add('hidden');
    showToast(hasFinals ? 'Grades saved!' : 'Midterm saved. Finals can be added later.');
    renderMyClassStudents();
  } catch(err) { showToast('Failed to save: '+err.message,'error'); }
}

/* ── My Risk Report — only MY classes ── */
async function renderMyRiskReport() {
  document.getElementById('topbarTitle').textContent = 'My Risk Report';
  document.getElementById('topbarBreadcrumb').textContent = 'My Teaching';
  document.getElementById('topbarRight').innerHTML = `
    <button class="topbar-btn primary" onclick="exportMyRiskReportPDF()" title="Export PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width:13px;height:13px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export PDF
    </button>`;
  document.getElementById('pageContent').innerHTML = loadingHTML();

  try {
    // ONLY grades from classes the coordinator personally teaches
    const classSnap = await db.collection('classes').where('profEmail','==', currentUser.email).get();
    const myClassIds = classSnap.docs.map(d=>d.id);

    if (!myClassIds.length) {
      document.getElementById('pageContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">No classes assigned to you</div></div>`;
      return;
    }

    const gradeSnaps = await Promise.all(myClassIds.map(id=>db.collection('grades').where('class_id','==',id).get()));
    let allGrades = [];
    gradeSnaps.forEach(snap=>snap.docs.forEach(d=>allGrades.push(d.data())));

    // Deduplicate
    const seen = new Set();
    allGrades = allGrades.filter(g=>{
      const k=`${g.student_name}_${g.class_id}`;
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });

    const critical = sortStudents(allGrades.filter(g=>computeRisk(g.average_grade)==='Critically At Risk').map(g=>({student_name:g.student_name,className:g.class_name||g.subject_name,avg:g.average_grade})));
    const moderate = sortStudents(allGrades.filter(g=>computeRisk(g.average_grade)==='Moderately At Risk').map(g=>({student_name:g.student_name,className:g.class_name||g.subject_name,avg:g.average_grade})));
    const slight   = sortStudents(allGrades.filter(g=>computeRisk(g.average_grade)==='Slightly At Risk').map(g=>({student_name:g.student_name,className:g.class_name||g.subject_name,avg:g.average_grade})));

    if (!allGrades.length) {
      document.getElementById('pageContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">No grades encoded yet</div></div>`;
      return;
    }

    const section = (level, items) => {
      if (!items.length) return '';
      return `<div class="panel" style="margin-bottom:18px">
        <div class="panel-header"><span class="panel-title">${riskBadge(level)} — ${items.length} Student${items.length>1?'s':''}</span></div>
        <div class="table-scroll-wrap" style="overflow-x:auto"><table class="data-table" style="min-width:380px">
          <thead><tr><th>Name</th><th>Class</th><th>Average</th><th>Risk</th></tr></thead>
          <tbody>${items.map(s=>`<tr><td>${s.student_name}</td><td>${s.className||'—'}</td><td>${s.avg.toFixed(1)}%</td><td>${riskBadge(level)}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>`;
    };

    document.getElementById('pageContent').innerHTML =
      section('Critically At Risk',critical)+section('Moderately At Risk',moderate)+section('Slightly At Risk',slight);
  } catch(err) {
    document.getElementById('pageContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`;
  }
}

async function exportMyRiskReportPDF() {
  showToast('Generating PDF…');
  try {
    const classSnap = await db.collection('classes').where('profEmail','==', currentUser.email).get();
    const myClasses = classSnap.docs.map(d=>({id:d.id,...d.data()}));
    const rows = [];
    for (const c of myClasses) {
      const [eSnap, gSnap] = await Promise.all([
        db.collection('enrollments').where('class_id','==',c.id).get(),
        db.collection('grades').where('class_id','==',c.id).get()
      ]);
      const gMap = {}; gSnap.docs.forEach(d=>{ gMap[d.data().enrollment_id]=d.data(); gMap[d.id]=d.data(); });
      eSnap.docs.sort((a,b)=>(a.data().student_name||'').localeCompare(b.data().student_name||'')).forEach(d=>{
        const e=d.data(), g=gMap[d.id]||gMap[e.enrollment_id];
        const sNum=(e.student_email||'').split('@')[0]||'—';
        rows.push([sNum, e.student_name||'—', c.name, g?g.midterm_grade+'%':'—', g?g.finals_grade+'%':'—', g?(g.average_grade||0).toFixed(1)+'%':'—', g?computeRisk(g.average_grade||0):'—', g?computeStatus(g.average_grade||0):'—']);
      });
    }
    if (!rows.length) { showToast('No grade data to export.','error'); return; }
    buildPDF('My Teaching Risk Report', `Instructor: ${currentUser.name} | ${new Date().toLocaleDateString('en-PH')}`,
      ['Student ID','Student Name','Class','Midterm (%)','Finals (%)','Average','Risk Level','Status'], rows,
      `EduTrack_MyTeaching_${Date.now()}.pdf`);
  } catch(err) { showToast('Export failed: '+err.message,'error'); }
}

async function exportMyClassPDF() {
  if (!currentMyClass) return;
  showToast('Generating PDF…');
  try {
    const [eSnap, gSnap] = await Promise.all([
      db.collection('enrollments').where('class_id','==',currentMyClassId).get(),
      db.collection('grades').where('class_id','==',currentMyClassId).get()
    ]);
    const gMap = {}; gSnap.docs.forEach(d=>{ gMap[d.data().enrollment_id]=d.data(); gMap[d.id]=d.data(); });
    const rows = eSnap.docs.sort((a,b)=>(a.data().student_name||'').localeCompare(b.data().student_name||'')).map(d=>{
      const e=d.data(), g=gMap[d.id]||gMap[e.enrollment_id];
      const sNum=(e.student_email||'').split('@')[0]||'—';
      const remarks=!g?'Not encoded':(!g.finals_grade?'Finals pending':'');
      return [sNum, e.student_name||'—', g?g.midterm_grade+'%':'—', g?g.finals_grade+'%':'—', g?(g.average_grade||0).toFixed(1)+'%':'—', g?computeRisk(g.average_grade||0):'—', g?computeStatus(g.average_grade||0):'—', remarks];
    });
    buildPDF(`Class Report — ${currentMyClass.name}`, `Subject: ${currentMyClass.subject} | Instructor: ${currentUser.name}`,
      ['Student ID','Student Name','Midterm (%)','Finals (%)','Average','Risk Level','Status','Remarks'], rows,
      `EduTrack_${currentMyClass.name.replace(/\s/g,'_')}_${Date.now()}.pdf`);
  } catch(err) { showToast('Export failed: '+err.message,'error'); }
}
async function renderClasses() {
  currentClass = null;
  document.getElementById('topbarTitle').textContent = 'All Classes';
  document.getElementById('topbarBreadcrumb').textContent = 'Program Coordinator Dashboard';
  document.getElementById('topbarRight').innerHTML = '';
  document.getElementById('pageContent').innerHTML = loadingHTML();

  try {
    // Get coordinator's program from their user doc
    const coordProgram = currentUser?.program || currentUser?.dept || '';

    // Filter classes by coordinator's program (e.g. BSCS coordinator sees only BSCS classes)
    let query = db.collection('classes');
    const snap = await query.get();
    let classes = snap.docs.map(d=>({id:d.id,...d.data()}));

    // Filter by coordinator's program — match class name starts with program
    if (coordProgram) {
      classes = classes.filter(c =>
        (c.program && c.program === coordProgram) ||
        (c.name && c.name.toUpperCase().startsWith(coordProgram.toUpperCase()))
      );
    }

    if (!classes.length) {
      document.getElementById('pageContent').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-title">No classes found${coordProgram ? ` for ${coordProgram}` : ''}</div>
          <div class="empty-state-sub">Admin needs to create classes for your program.</div>
        </div>`;
      return;
    }

    // Group by year level
    const byYear = {};
    classes.forEach(c => {
      const yr = c.year_level || (c.name?.match(/\d/)?.[0]) || '?';
      if (!byYear[yr]) byYear[yr] = [];
      byYear[yr].push(c);
    });

    const years = Object.keys(byYear).sort();
    let html = '';

    for (const yr of years) {
      html += `<div style="margin-bottom:24px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <div style="font-size:0.75rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em">
            ${yr === '?' ? 'Unassigned Year' : `Year ${yr}`}
          </div>
          <div style="flex:1;height:1px;background:var(--border)"></div>
          <div style="font-size:0.72rem;color:var(--text3)">${byYear[yr].length} class${byYear[yr].length!==1?'es':''}</div>
        </div>
        <div class="class-grid" style="margin-bottom:0">`;

      const cards = await Promise.all(byYear[yr].map(async (c,i)=>{
        const eSnap = await db.collection('enrollments').where('class_id','==',c.id).get();
        const gSnap = await db.collection('grades').where('class_id','==',c.id).get();
        const grades = gSnap.docs.map(d=>d.data());
        const risk = grades.length ? countRiskFromGrades(grades) : {safe:0,slight:0,moderate:0,critical:0};
        return `
          <div class="class-card" style="animation-delay:${i*0.06}s" onclick="openClass('${c.id}')" role="button" tabindex="0" aria-label="View ${c.name}">
            <div class="class-card-header"><div class="class-card-title">${c.name}</div><div class="class-card-sub">${c.subject||''}</div></div>
            <div class="class-card-body">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px">
                <div style="padding:8px;background:var(--safe-bg);border-radius:8px;text-align:center">
                  <div style="font-size:1.1rem;font-weight:800;color:var(--safe)">${risk.safe}</div>
                  <div style="font-size:0.67rem;color:var(--text3)">Safe</div>
                </div>
                <div style="padding:8px;background:var(--critical-bg);border-radius:8px;text-align:center">
                  <div style="font-size:1.1rem;font-weight:800;color:var(--critical)">${risk.critical}</div>
                  <div style="font-size:0.67rem;color:var(--text3)">Critical</div>
                </div>
              </div>
              <div class="class-card-footer">
                <div class="class-student-count">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                  ${eSnap.size} students
                </div>
                <button class="enter-btn" title="View ${c.name}">View <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="width:11px;height:11px"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
              </div>
            </div>
          </div>`;
      }));

      html += cards.join('') + '</div></div>';
    }

    document.getElementById('pageContent').innerHTML = html;
  } catch(err) {
    document.getElementById('pageContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`;
  }
}

async function openClass(classId) {
  document.getElementById('pageContent').innerHTML = loadingHTML();
  try {
    const snap = await db.collection('classes').doc(classId).get();
    currentClass = { id:snap.id, ...snap.data() };
    document.getElementById('topbarTitle').textContent = currentClass.name;
    document.getElementById('topbarBreadcrumb').textContent = currentClass.subject||'';
    document.getElementById('topbarRight').innerHTML = `
      <div class="tab-row" id="classTabs">
        <button class="tab-btn active" onclick="switchTab('dashboard',this)">Dashboard</button>
        <button class="tab-btn" onclick="switchTab('students',this)">Students</button>
      </div>`;
    renderClassDashboard(classId);
  } catch(err) { showToast('Failed to load class.','error'); }
}

function switchTab(tab,el) {
  document.querySelectorAll('#classTabs .tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  if (tab==='dashboard') renderClassDashboard(currentClass.id);
  else renderClassStudents(currentClass.id);
}

async function renderClassDashboard(classId) {
  document.getElementById('pageContent').innerHTML = loadingHTML();
  try {
    const gSnap = await db.collection('grades').where('class_id','==',classId).get();
    const grades = gSnap.docs.map(d=>d.data());
    const risk = countRiskFromGrades(grades);
    const A=grades.filter(g=>g.average_grade>=90).length, B=grades.filter(g=>g.average_grade>=80&&g.average_grade<90).length,
          C=grades.filter(g=>g.average_grade>=75&&g.average_grade<80).length, D=grades.filter(g=>g.average_grade<75).length;
    const mb=Math.max(A,B,C,D,1);

    document.getElementById('pageContent').innerHTML = `
      <div class="stats-row">
        <div class="stat-card safe"><div class="stat-card-top"><span class="stat-card-label">Safe</span><div class="stat-card-icon">✅</div></div><div class="stat-card-value">${risk.safe}</div><div class="stat-card-sub">On track</div></div>
        <div class="stat-card slight"><div class="stat-card-top"><span class="stat-card-label">Slightly At Risk</span><div class="stat-card-icon">⚠️</div></div><div class="stat-card-value">${risk.slight}</div><div class="stat-card-sub">Monitor</div></div>
        <div class="stat-card moderate"><div class="stat-card-top"><span class="stat-card-label">Moderately At Risk</span><div class="stat-card-icon">🔶</div></div><div class="stat-card-value">${risk.moderate}</div><div class="stat-card-sub">Intervention</div></div>
        <div class="stat-card critical"><div class="stat-card-top"><span class="stat-card-label">Critically At Risk</span><div class="stat-card-icon">🚨</div></div><div class="stat-card-value">${risk.critical}</div><div class="stat-card-sub">Immediate</div></div>
      </div>
      <div class="charts-row">
        <div class="chart-panel">
          <div class="chart-title">Grade Distribution</div>
          <div class="bar-chart">
            ${[{l:'A (90-100)',v:A},{l:'B (80-89)',v:B},{l:'C (75-79)',v:C},{l:'D (<75)',v:D}].map(b=>`
            <div class="bar-wrap"><div class="bar" style="height:${Math.round(b.v/mb*100)}%"></div><span class="bar-label">${b.l}</span></div>`).join('')}
          </div>
        </div>
        <div class="chart-panel">
          <div class="chart-title">Risk Distribution</div>
          <div class="donut-wrap">
            <div class="donut"><div class="donut-inner"></div></div>
            <div class="donut-legend">
              <div class="legend-item"><div class="legend-dot" style="background:var(--safe)"></div>Safe — ${risk.safe}</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--slight)"></div>Slightly — ${risk.slight}</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--moderate)"></div>Moderate — ${risk.moderate}</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--critical)"></div>Critical — ${risk.critical}</div>
            </div>
          </div>
        </div>
      </div>`;
  } catch(err) { document.getElementById('pageContent').innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`; }
}

async function renderClassStudents(classId) {
  document.getElementById('pageContent').innerHTML = loadingHTML();
  try {
    const [eSnap, gSnap] = await Promise.all([
      db.collection('enrollments').where('class_id','==',classId).get(),
      db.collection('grades').where('class_id','==',classId).get()
    ]);
    const gradesMap = {};
    gSnap.docs.forEach(d=>{ gradesMap[d.data().enrollment_id]={id:d.id,...d.data()}; });

    const students = eSnap.docs.map(d=>{
      const e={enrollment_id:d.id,...d.data()};
      const g=gradesMap[d.id];
      return {...e, avg:g?.average_grade||0, has_grade:!!g};
    });

    const sorted = sortStudents(students);
    const rows = sorted.map(s=>`<tr>
      <td>${s.student_name}</td>
      <td>${s.has_grade?`<strong style="color:${s.avg>=75?'var(--text)':'var(--critical)'}">${s.avg.toFixed(1)}%</strong>`:'<span style="color:var(--text3);font-size:0.8rem">Not encoded</span>'}</td>
      <td>${s.has_grade?riskBadge(computeRisk(s.avg)):'—'}</td>
      <td>${s.has_grade?statusBadge(computeStatus(s.avg)):'—'}</td>
    </tr>`).join('');

    document.getElementById('pageContent').innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Students — ${sorted.length} (A–Z)</span>
          <button class="btn btn-primary" onclick="exportClassReportPDF('${classId}','${(currentClass?.name||'').replace(/'/g,"\\'")}','${(currentClass?.subject||'').replace(/'/g,"\\'")}'')" title="Export PDF">

            <tr>
              <th scope="col">Student Name</th>
              <th scope="col">Average</th>
              <th scope="col">Risk Level</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>${rows||'<tr><td colspan="4"><div class="empty-state"><div class="empty-state-icon">👤</div><div class="empty-state-title">No students enrolled yet</div></div></td></tr>'}</tbody>
        </table>

  } catch(err) { document.getElementById('pageContent').innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`; }

async function renderReports() {
  document.getElementById('topbarTitle').textContent = 'Risk Reports';
  document.getElementById('topbarBreadcrumb').textContent = 'Program Coordinator Dashboard';
  document.getElementById('topbarRight').innerHTML = `<button class="topbar-btn primary" onclick="exportAllReportsPDF()" title="Export all as PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width:13px;height:13px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export PDF</button>`;
  document.getElementById('pageContent').innerHTML = loadingHTML();

  try {
    const gSnap = await db.collection('grades').get();
    const allGrades = gSnap.docs.map(d=>d.data());
    const critical = sortStudents(allGrades.filter(g=>computeRisk(g.average_grade)==='Critically At Risk').map(g=>({student_name:g.student_name,className:g.class_name||g.subject_name,avg:g.average_grade})));
    const moderate = sortStudents(allGrades.filter(g=>computeRisk(g.average_grade)==='Moderately At Risk').map(g=>({student_name:g.student_name,className:g.class_name||g.subject_name,avg:g.average_grade})));

    if (!allGrades.length) {
      document.getElementById('pageContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">No grades encoded yet</div><div class="empty-state-sub">Teachers need to encode grades first.</div></div>`;
      return;
    }

    const section = (level,items) => {
      if (!items.length) return '';
      return `<div class="panel" style="margin-bottom:18px">
        <div class="panel-header"><span class="panel-title">${riskBadge(level)} — ${items.length} Student${items.length>1?'s':''}</span></div>
        <table class="data-table"><thead><tr><th>Name</th><th>Class</th><th>Average</th><th>Risk</th></tr></thead>
        <tbody>${items.map(s=>`<tr><td>${s.student_name}</td><td>${s.className||'—'}</td><td>${s.avg.toFixed(1)}%</td><td>${riskBadge(level)}</td></tr>`).join('')}</tbody>
        </table></div>`;
    };

    document.getElementById('pageContent').innerHTML =
      section('Critically At Risk',critical)+section('Moderately At Risk',moderate);
  } catch(err) { document.getElementById('pageContent').innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`; }
}

function countRiskFromGrades(grades) {
  return grades.reduce((a,g)=>{
    const r=computeRisk(g.average_grade||0);
    if(r==='Safe') a.safe++; else if(r==='Slightly At Risk') a.slight++;
    else if(r==='Moderately At Risk') a.moderate++; else a.critical++;
    return a;
  },{safe:0,slight:0,moderate:0,critical:0});
}

/* =============================================
   PDF EXPORT
   ============================================= */
function buildPDF(title, subtitle, columns, rows, filename) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const now = new Date().toLocaleDateString('en-PH', { year:'numeric', month:'long', day:'numeric' });

  // Header
  doc.setFillColor(26, 53, 32);
  doc.rect(0, 0, 210, 28, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(16); doc.setFont('helvetica', 'bold');
  doc.text('EduTrack AI', 14, 11);
  doc.setFontSize(9); doc.setFont('helvetica', 'normal');
  doc.setTextColor(180, 220, 180);
  doc.text('Academic Risk & Performance Monitor — Gordon College', 14, 17);
  doc.text(`Generated: ${now}`, 14, 23);

  // Title
  doc.setTextColor(26, 53, 32);
  doc.setFontSize(14); doc.setFont('helvetica', 'bold');
  doc.text(title, 14, 38);
  if (subtitle) {
    doc.setFontSize(10); doc.setFont('helvetica', 'normal');
    doc.setTextColor(80, 80, 80);
    doc.text(subtitle, 14, 45);
  }

  doc.autoTable({
    head: [columns],
    body: rows,
    startY: subtitle ? 50 : 44,
    theme: 'grid',
    headStyles: { fillColor:[46,125,50], textColor:255, fontStyle:'bold', fontSize:9 },
    bodyStyles: { fontSize:8.5, textColor:[30,30,30] },
    alternateRowStyles: { fillColor:[240,248,240] },
    columnStyles: { 0: { cellWidth: 60 } },
    margin: { left:14, right:14 }
  });

  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(150);
    doc.text(`EduTrack AI — Confidential | Page ${i} of ${pageCount}`, 14, 290);
  }
  doc.save(filename);
  showToast('PDF exported successfully!');
}

async function exportAllReportsPDF() {
  showToast('Generating PDF…');
  try {
    const gSnap = await db.collection('grades').get();
    const rows  = gSnap.docs
      .map(d => d.data())
      .sort((a,b) => (a.student_name||'').localeCompare(b.student_name||''))
      .map(g => [
        g.student_name || '—',
        g.class_name   || g.subject_name || '—',
        (g.average_grade||0).toFixed(1) + '%',
        computeRisk(g.average_grade||0),
        computeStatus(g.average_grade||0)
      ]);

    if (!rows.length) { showToast('No grade data to export yet.', 'error'); return; }

    buildPDF(
      'Academic Risk Report — All Classes',
      `Program Coordinator Report | ${new Date().toLocaleDateString('en-PH')}`,
      ['Student Name', 'Class', 'Average', 'Risk Level', 'Status'],
      rows,
      `EduTrack_All_Classes_Report_${Date.now()}.pdf`
    );
  } catch(err) { showToast('Export failed: ' + err.message, 'error'); }
}

async function exportClassReportPDF(classId, className, subject) {
  showToast('Generating PDF…');
  try {
    const [eSnap, gSnap] = await Promise.all([
      db.collection('enrollments').where('class_id','==',classId).get(),
      db.collection('grades').where('class_id','==',classId).get()
    ]);
    const gradesMap = {};
    gSnap.docs.forEach(d => { gradesMap[d.data().enrollment_id] = d.data(); });

    const rows = eSnap.docs
      .map(d => {
        const e = d.data();
        const g = gradesMap[d.id];
        return [
          e.student_name || '—',
          g ? g.midterm_grade + '%' : '—',
          g ? g.finals_grade  + '%' : '—',
          g ? g.average_grade.toFixed(1) + '%' : '—',
          g ? computeRisk(g.average_grade) : '—',
          g ? computeStatus(g.average_grade) : '—'
        ];
      })
      .sort((a,b) => a[0].localeCompare(b[0]));

    buildPDF(
      `Class Report — ${className}`,
      `Subject: ${subject}`,
      ['Student Name', 'Midterm', 'Finals', 'Average', 'Risk Level', 'Status'],
      rows,
      `EduTrack_${className.replace(/\s/g,'_')}_${Date.now()}.pdf`
    );
  } catch(err) { showToast('Export failed: ' + err.message, 'error'); }
}
