<script>
 
let currentUser    = null;
let currentClassId = null;
let currentClassData = null;
let editingEnrollmentId = null;
let editingGradeDocId   = null;
let deletingEnrollmentId = null;
let deletingGradeDocId   = null;
let searchTerm = '';
 
document.addEventListener('DOMContentLoaded', () => {
  initPage('teacher', (user) => {
    currentUser = user;
    populateSidebar(user);
    renderClassesView();
  });
});
 
function showView(view, linkEl) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  if (linkEl) linkEl.classList.add('active');
  if (view === 'classes') renderClassesView();
  else renderReportsView();
}
 
/* ── Classes View ── */
async function renderClassesView() {
  currentClassId = null;
  setTopbar('My Classes','Teacher Dashboard');
  document.getElementById('topbarRight').innerHTML = '';
  document.getElementById('pageContent').innerHTML = loadingHTML();
 
  try {
    const snap = await db.collection('classes').where('profEmail','==', currentUser.email).get();
    const classes = snap.docs.map(d=>({id:d.id,...d.data()}));
 
    if (!classes.length) {
      document.getElementById('pageContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-title">No classes assigned yet</div><div class="empty-state-sub">An admin will assign classes to your account.</div></div>`;
      return;
    }
 
    // Get student counts from enrollments
    const cards = await Promise.all(classes.map(async (c,i) => {
      const eSnap = await db.collection('enrollments').where('class_id','==',c.id).get();
      const count = eSnap.size;
      return `
        <div class="class-card" style="animation-delay:${i*0.06}s" onclick="openClass('${c.id}')" role="button" tabindex="0" aria-label="Open class ${c.name}">
          <div class="class-card-header"><div class="class-card-title">${c.name}</div><div class="class-card-sub">${c.subject||''}</div></div>
          <div class="class-card-body">
            <div class="class-meta">
              <div class="class-meta-item"><span>Classcode:</span><span>${c.code||'—'}</span></div>
              <div class="class-meta-item"><span>Schedule:</span><span>${c.schedule||'—'}</span></div>
              <div class="class-meta-item"><span>Room:</span><span>${c.room||'—'}</span></div>
            </div>
            <div class="class-card-footer">
              <div class="class-student-count">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                ${count} students
              </div>
              <button class="enter-btn" title="Enter class ${c.name}">Enter <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="width:11px;height:11px"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
            </div>
          </div>
        </div>`;
    }));
    document.getElementById('pageContent').innerHTML = `<div class="class-grid">${cards.join('')}</div>`;
  } catch(err) {
    document.getElementById('pageContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Error loading classes</div><div class="empty-state-sub">${err.message}</div></div>`;
  }
}
 
/* ── Class Detail ── */
async function openClass(classId) {
  currentClassId = classId;
  document.getElementById('pageContent').innerHTML = loadingHTML();
  try {
    const snap = await db.collection('classes').doc(classId).get();
    currentClassData = { id:snap.id, ...snap.data() };
    setTopbar(currentClassData.name, currentClassData.subject||'');
    document.getElementById('topbarRight').innerHTML = `
      <div class="tab-row" id="classTabRow">
        <button class="tab-btn active" onclick="switchClassTab('dashboard',this)">Dashboard</button>
        <button class="tab-btn" onclick="switchClassTab('students',this)">Students</button>
      </div>`;
    renderClassDashboard(classId);
  } catch(err) { showToast('Failed to load class.','error'); }
}
 
function switchClassTab(tab,el) {
  document.querySelectorAll('#classTabRow .tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  if (tab==='dashboard') renderClassDashboard(currentClassId);
  else renderClassStudents(currentClassId);
}
 
/* ── Class Dashboard ── */
async function renderClassDashboard(classId) {
  document.getElementById('pageContent').innerHTML = loadingHTML();
  try {
    const students = await getStudentsWithGrades(classId);
    const risk = countRisk(students);
    const A=students.filter(s=>s.avg>=90).length, 
          B=students.filter(s=>s.avg>=80&&s.avg<90).length,
          C=students.filter(s=>s.avg>=75&&s.avg<80).length, 
          D=students.filter(s=>s.avg<75).length;
    const mb=Math.max(A,B,C,D,1);
 
    document.getElementById('pageContent').innerHTML = `
      <div class="stats-row">
        <div class="stat-card safe"><div class="stat-card-top"><span class="stat-card-label">Safe</span><div class="stat-card-icon">✅</div></div><div class="stat-card-value">${risk.safe}</div><div class="stat-card-sub">On track</div></div>
        <div class="stat-card slight"><div class="stat-card-top"><span class="stat-card-label">Slightly At Risk</span><div class="stat-card-icon">⚠️</div></div><div class="stat-card-value">${risk.slight}</div><div class="stat-card-sub">Monitor closely</div></div>
        <div class="stat-card moderate"><div class="stat-card-top"><span class="stat-card-label">Moderately At Risk</span><div class="stat-card-icon">🔶</div></div><div class="stat-card-value">${risk.moderate}</div><div class="stat-card-sub">Needs intervention</div></div>
        <div class="stat-card critical"><div class="stat-card-top"><span class="stat-card-label">Critically At Risk</span><div class="stat-card-icon">🚨</div></div><div class="stat-card-value">${risk.critical}</div><div class="stat-card-sub">Immediate action</div></div>
      </div>
      <div class="charts-row">
        <div class="chart-panel">
          <div class="chart-title">Grade Distribution</div>
          <div class="bar-chart">
            ${[{l:'A (90-100)',v:A},{l:'B (80-89)',v:B},{l:'C (75-79)',v:C},{l:'D (<75)',v:D}].map(b=>`
            <div class="bar-wrap"><div class="bar" style="height:${Math.round(b.v/mb*100)}%" title="${b.l}: ${b.v}"></div><span class="bar-label">${b.l}</span></div>`).join('')}
          </div>
        </div>
        <div class="chart-panel">
          <div class="chart-title">Risk Distribution</div>
          <div class="donut-wrap">
            <div class="donut"><div class="donut-inner"></div></div>
            <div class="donut-legend">
              <div class="legend-item"><div class="legend-dot" style="background:var(--safe)"></div>Safe — ${risk.safe}</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--slight)"></div>Slightly — ${risk.slight}</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--moderate)"></div>Moderate — ${risk.moderate}</div>
              <div class="legend-item"><div class="legend-dot" style="background:var(--critical)"></div>Critical — ${risk.critical}</div>
            </div>
          </div>
        </div>
      </div>`;
  } catch(err) { document.getElementById('pageContent').innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`; }
}
 
/* ── Class Students ── */
async function renderClassStudents(classId) {
  document.getElementById('pageContent').innerHTML = loadingHTML();
  try {
    const all = await getStudentsWithGrades(classId);
    const filtered = sortStudents(
      searchTerm ? all.filter(s=>s.student_name.toLowerCase().includes(searchTerm.toLowerCase())) : all
    );
    const rMap={Safe:'safe','Slightly At Risk':'slight','Moderately At Risk':'moderate','Critically At Risk':'critical'};
    const rows = filtered.map(s=>`<tr>
      <td style="font-size:0.75rem;color:var(--text3);white-space:nowrap">${s.student_number||'—'}</td>
      <td style="font-weight:500">${s.student_name}</td>
      <td style="padding:4px 8px">
        <input type="number" min="0" max="100" step="0.01"
          value="${s.has_grade ? s.avg : ''}" placeholder="—"
          data-enroll="${s.enrollment_id}"
          data-gradedoc="${s.grade_doc_id||''}"
          data-name="${s.student_name.replace(/"/g,'&quot;')}"
          onchange="saveInlineGrade(this)"
          onfocus="this.select();this.style.borderColor='var(--green)'"
          onblur="this.style.borderColor='var(--border)'"
          style="width:80px;padding:5px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:0.88rem;font-weight:600;text-align:center;background:var(--surface);color:var(--text)"/>
      </td>
      <td id="risk_${s.enrollment_id}">${s.has_grade?`<span class="risk-badge ${rMap[computeRisk(s.avg)]||'safe'}">${computeRisk(s.avg)}</span>`:'<span style="color:var(--text3)">—</span>'}</td>
      <td id="status_${s.enrollment_id}">${s.has_grade?statusBadge(computeStatus(s.avg)):'<span style="color:var(--text3)">—</span>'}</td>
      <td><button class="action-btn delete" onclick="openDelete('${s.enrollment_id}','${s.student_name.replace(/'/g,"\'")}','${s.grade_doc_id||''}')" title="Remove">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button></td>
    </tr>`).join('');
 
    document.getElementById('pageContent').innerHTML = `
      <div class="panel">
        <div class="panel-header">
          <div class="search-bar" style="width:100%;max-width:300px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <label for="studentSearch" class="sr-only">Search students</label>
            <input type="search" id="studentSearch" class="search-input" placeholder="Search student…" title="Search by name" aria-label="Search students" oninput="searchTerm=this.value;renderClassStudents('${classId}')" value="${searchTerm}"/>
          </div>
          <span style="font-size:0.78rem;color:var(--text3)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;vertical-align:middle" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            ${filtered.length} student${filtered.length!==1?'s':''}
          </span>
        </div>
        <div style="padding:8px 16px;background:var(--green-light);border-bottom:1px solid rgba(46,125,50,0.15);font-size:0.78rem;color:var(--green)">
        💡 Click any cell → type Final Grade (0–100) → <kbd style="background:rgba(255,255,255,0.7);padding:1px 5px;border-radius:3px;font-size:0.72rem">Enter</kbd> to auto-save.
      </div>
      <div class="scroll-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Swipe to see more</div>
        <div class="table-scroll-wrap">
          <table class="data-table" style="min-width:520px" aria-label="Students sorted alphabetically">
            <thead>
              <tr>
                <th scope="col" style="width:88px">Student ID</th>
                <th scope="col">Student Name</th>
                <th scope="col" style="width:112px">Final Grade (%)</th>
                <th scope="col">Risk Level</th>
                <th scope="col">Status</th>
                <th scope="col" style="width:44px">Del</th>
              </tr>
            </thead>
            <tbody>${rows || '<tr><td colspan="5"><div class="empty-state"><div class="empty-state-icon">👤</div><div class="empty-state-title">No students enrolled yet</div><div class="empty-state-sub">Ask the admin to assign students to this class.</div></div></td></tr>'}</tbody>
          </table>
        </div>

  } catch(err) { document.getElementById('pageContent').innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`; }

/* ── Reports View ── */
async function renderReportsView() {
  setTopbar('Risk Reports','Teacher Dashboard');
  document.getElementById('topbarRight').innerHTML = `<button class="topbar-btn primary" onclick="exportReportPDF()" title="Export PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width:13px;height:13px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export PDF</button>`;
  document.getElementById('pageContent').innerHTML = loadingHTML();
 
  try {
    const classSnap = await db.collection('classes').where('profEmail','==',currentUser.email).get();
    const classes = classSnap.docs.map(d=>({id:d.id,...d.data()}));
 
    const riskGroups = {critical:[],moderate:[],slight:[],safe:[]};
    for (const c of classes) {
      const studs = await getStudentsWithGrades(c.id);
      studs.filter(s=>s.has_grade).forEach(s=>{
        const r = computeRisk(s.avg);
        const key = r==='Critically At Risk'?'critical':r==='Moderately At Risk'?'moderate':r==='Slightly At Risk'?'slight':'safe';
        riskGroups[key].push({...s, className:c.name});
      });
    }
 
    const section = (level,key) => {
      const items = sortStudents(riskGroups[key]);
      if (!items.length) return '';
      return `<div class="panel" style="margin-bottom:18px">
        <div class="panel-header"><span class="panel-title">${riskBadge(level)} — ${items.length} Student${items.length>1?'s':''}</span></div>
        <table class="data-table"><thead><tr><th>Student</th><th>Class</th><th>Average</th><th>Risk</th></tr></thead>
        <tbody>${items.map(s=>`<tr><td>${s.student_name}</td><td>${s.className}</td><td>${s.avg.toFixed(1)}%</td><td>${riskBadge(level)}</td></tr>`).join('')}</tbody>
        </table></div>`;
    };
 
    const html = section('Critically At Risk','critical')+section('Moderately At Risk','moderate')+section('Slightly At Risk','slight')+section('Safe','safe');
    document.getElementById('pageContent').innerHTML = html || `<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">No grade data yet</div><div class="empty-state-sub">Encode student grades first.</div></div>`;
  } catch(err) { document.getElementById('pageContent').innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${err.message}</div></div>`; }
}
 
/* ── Firestore helpers ── */
async function getStudentsWithGrades(classId) {
  const [eSnap, gSnap] = await Promise.all([
    db.collection('enrollments').where('class_id','==',classId).get(),
    db.collection('grades').where('class_id','==',classId).get()
  ]);
  // Dedup grades — keep most recent per enrollment
  const gradesMap = {};
  gSnap.docs.forEach(d => {
    const data = d.data(), key = data.enrollment_id;
    if (!gradesMap[key]||(data.updated_at?.seconds||0)>(gradesMap[key]?.updated_at?.seconds||0))
      gradesMap[key] = {id:d.id,...data};
  });
  // Dedup enrollments — one row per student
  const seen = new Set();
  const result = eSnap.docs
    .filter(d => { const n=d.data().student_name; if(seen.has(n)) return false; seen.add(n); return true; })
    .map(d => {
      const e={enrollment_id:d.id,...d.data()}, g=gradesMap[d.id];
      const fg = g?.finals_grade ?? g?.average_grade ?? null;
      return {
        enrollment_id:  d.id,
        student_name:   e.student_name,
        student_email:  e.student_email||'',
        student_number: (e.student_email||'').split('@')[0]||'',
        avg:            fg !== null ? fg : 0,
        grade_doc_id:   g?.id||null,
        has_grade:      fg !== null
      };
    });
  _cachedStudents = result;
  return result;
}
 
function countRisk(students) {
  return students.filter(s=>s.has_grade).reduce((a,s)=>{
    const r=computeRisk(s.avg);
    if(r==='Safe') a.safe++; else if(r==='Slightly At Risk') a.slight++;
    else if(r==='Moderately At Risk') a.moderate++; else a.critical++;
    return a;
  },{safe:0,slight:0,moderate:0,critical:0});
}
 
/* ── Inline grade encoding (Final Grade only) ── */
let _cachedStudents = [];
 
function openEditGrade()    {}   // no-op — replaced by inline
function previewGrade()     {}
function confirmEditGrade() {}
 
async function saveInlineGrade(input) {
  const enrollId   = input.getAttribute('data-enroll');
  const gradeDocId = input.getAttribute('data-gradedoc') || null;
  const sName      = input.getAttribute('data-name');
  const rawVal     = input.value.trim();
 
  // Empty → clear grade
  if (!rawVal) {
    if (gradeDocId) {
      try { await db.collection('grades').doc(gradeDocId).delete(); } catch(e){}
    }
    const s = _cachedStudents.find(x=>x.enrollment_id===enrollId);
    if (s) { s.has_grade=false; s.avg=0; input.setAttribute('data-gradedoc',''); }
    const rEl=document.getElementById('risk_'+enrollId);
    const sEl=document.getElementById('status_'+enrollId);
    if(rEl) rEl.innerHTML='<span style="color:var(--text3)">—</span>';
    if(sEl) sEl.innerHTML='<span style="color:var(--text3)">—</span>';
    return;
  }
 
  const grade = parseFloat(rawVal);
  if (isNaN(grade)||grade<0||grade>100) {
    input.style.borderColor='var(--critical)';
    showToast('Grade must be between 0 and 100.','error');
    return;
  }
 
  const risk   = computeRisk(grade);
  const status = computeStatus(grade);
  const riskMap = {'Safe':'safe','Slightly At Risk':'slight','Moderately At Risk':'moderate','Critically At Risk':'critical'};
 
  const gradeData = {
    enrollment_id:  enrollId,
    student_name:   sName,
    class_id:       currentClassId,
    class_name:     currentClassData?.name    || '',
    subject_name:   currentClassData?.subject || '',
    finals_grade:   grade,
    average_grade:  grade,
    risk_level:     risk,
    passing_status: status,
    encoded_by:     currentUser.uid,
    updated_at:     firebase.firestore.FieldValue.serverTimestamp()
  };
 
  try {
    let docId = gradeDocId;
    if (gradeDocId) {
      await db.collection('grades').doc(gradeDocId).update(gradeData);
    } else {
      const ref = await db.collection('grades').add({
        ...gradeData, created_at: firebase.firestore.FieldValue.serverTimestamp()
      });
      docId = ref.id;
      input.setAttribute('data-gradedoc', docId);
    }
 
    const s = _cachedStudents.find(x=>x.enrollment_id===enrollId);
    if (s) { s.has_grade=true; s.avg=grade; s.grade_doc_id=docId; }
 
    const rEl=document.getElementById('risk_'+enrollId);
    const sEl=document.getElementById('status_'+enrollId);
    if(rEl) rEl.innerHTML=`<span class="risk-badge ${riskMap[risk]||'safe'}">${risk}</span>`;
    if(sEl) sEl.innerHTML=statusBadge(status);
 
    const ind = document.getElementById('saveIndicator');
    if (ind) {
      ind.style.display='flex';
      clearTimeout(ind._t);
      ind._t = setTimeout(()=>ind.style.display='none', 1800);
    }
    input.style.borderColor='var(--green)';
    setTimeout(()=>input.style.borderColor='var(--border)', 1500);
 
  } catch(err) {
    input.style.borderColor='var(--critical)';
    showToast('Save failed: '+err.message, 'error');
  }
}
 
function openDelete(enrollmentId, studentName, gradeDocId) {
  deletingEnrollmentId = enrollmentId;
  deletingGradeDocId   = gradeDocId || null;
  document.getElementById('deleteStudentName').textContent = studentName;
  document.getElementById('deleteModal').classList.remove('hidden');
}
 
async function confirmDelete() {
  try {
    const batch = db.batch();
    batch.delete(db.collection('enrollments').doc(deletingEnrollmentId));
    if (deletingGradeDocId) batch.delete(db.collection('grades').doc(deletingGradeDocId));
    await batch.commit();
    await db.collection('classes').doc(currentClassId).update({
      students: firebase.firestore.FieldValue.increment(-1)
    });
    closeModal('deleteModal');
    showToast('Student removed.');
    renderClassStudents(currentClassId);
  } catch(err) { showToast('Failed to remove student: '+err.message,'error'); }
}
 
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function setTopbar(t,b) { document.getElementById('topbarTitle').textContent=t; document.getElementById('topbarBreadcrumb').textContent=b; }
function loadingHTML() { return `<div style="display:flex;align-items:center;justify-content:center;height:40vh"><div class="spinner" style="width:30px;height:30px;border-width:3px;border-color:rgba(46,125,50,0.18);border-top-color:var(--green)"></div></div>`; }
 
/* =============================================
   PDF EXPORT FUNCTIONS
   ============================================= */
function buildPDF(title, subtitle, columns, rows, filename) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const now = new Date().toLocaleDateString('en-PH', { year:'numeric', month:'long', day:'numeric' });
 
  // Header background
  doc.setFillColor(26, 53, 32);
  doc.rect(0, 0, 210, 28, 'F');
 
  // Logo text
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(16);
  doc.setFont('helvetica', 'bold');
  doc.text('EduTrack AI', 14, 11);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(180, 220, 180);
  doc.text('Academic Risk & Performance Monitor — Gordon College', 14, 17);
  doc.text(`Generated: ${now}`, 14, 23);
 
  // Title
  doc.setTextColor(26, 53, 32);
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  doc.text(title, 14, 38);
 
  if (subtitle) {
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(80, 80, 80);
    doc.text(subtitle, 14, 45);
  }
 
  // Table
  doc.autoTable({
    head: [columns],
    body: rows,
    startY: subtitle ? 50 : 44,
    theme: 'grid',
    headStyles: {
      fillColor: [46, 125, 50],
      textColor: 255,
      fontStyle: 'bold',
      fontSize: 9
    },
    bodyStyles: { fontSize: 8.5, textColor: [30, 30, 30] },
    alternateRowStyles: { fillColor: [240, 248, 240] },
    columnStyles: { 0: { cellWidth: 55 } },
    margin: { left: 14, right: 14 }
  });
 
  // Footer
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text(`EduTrack AI — Confidential | Page ${i} of ${pageCount}`, 14, 290);
  }
 
  doc.save(filename);
  showToast('PDF exported successfully!');
}
 
async function exportReportPDF() {
  showToast('Generating PDF…');
  try {
    const classSnap = await db.collection('classes').where('profEmail','==', currentUser.email).get();
    const classes   = classSnap.docs.map(d => ({id:d.id,...d.data()}));
 
    const rows = [];
    for (const c of classes) {
      const studs = await getStudentsWithGrades(c.id);
      studs.filter(s => s.has_grade).forEach(s => {
        rows.push([
          s.student_name,
          c.name,
          s.avg.toFixed(1) + '%',
          computeRisk(s.avg),
          computeStatus(s.avg)
        ]);
      });
    }
 
    if (!rows.length) { showToast('No grade data to export yet.', 'error'); return; }
 
    rows.sort((a,b) => a[0].localeCompare(b[0]));
 
    buildPDF(
      'Academic Risk Report',
      `Teacher: ${currentUser.name} | ${new Date().toLocaleDateString('en-PH')}`,
      ['Student Name', 'Class', 'Average', 'Risk Level', 'Status'],
      rows,
      `EduTrack_Risk_Report_${Date.now()}.pdf`
    );
  } catch(err) { showToast('Export failed: ' + err.message, 'error'); }
}
 
async function exportClassStudentsPDF() {
  if (!currentClassId || !currentClassData) return;
  showToast('Generating PDF…');
  try {
    const studs = await getStudentsWithGrades(currentClassId);
    const sorted = [...studs].sort((a,b) => a.student_name.localeCompare(b.student_name));
    const rows = sorted.map(s => [
      s.student_name,
      s.has_grade ? s.midterm + '%' : '—',
      s.has_grade ? s.finals  + '%' : '—',
      s.has_grade ? s.avg.toFixed(1) + '%' : '—',
      s.has_grade ? computeRisk(s.avg) : '—',
      s.has_grade ? computeStatus(s.avg) : '—'
    ]);
 
    buildPDF(
      `Class Report — ${currentClassData.name}`,
      `Subject: ${currentClassData.subject} | Professor: ${currentUser.name}`,
      ['Student Name', 'Midterm', 'Finals', 'Average', 'Risk Level', 'Status'],
      rows,
      `EduTrack_${currentClassData.name.replace(/\s/g,'_')}_${Date.now()}.pdf`
    );
  } catch(err) { showToast('Export failed: ' + err.message, 'error'); }
}
